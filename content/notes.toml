[[items]]
title = "招生宣传片是怎么拍出来的：一个拍摄演员的视角"
subtitle = "视频内容理解力 · 初稿"
date = "2026-06"
tags = ["视频内容", "脚本共创", "镜头语言"]
content = """
站在镜头前和坐在监视器前，是完全不同的两种体验。作为南京医科大学常州校区招生宣传视频的拍摄演员，我一度以为"演"是最重要的部分，真正走完整个流程才发现，出镜只是内容链条的最后一环。

**取景阶段，我学会了"用画面思考"。** 第一次拿到脚本时，我满脑子都是"我该怎么说"。导演问了一句：这句话说出来的时候，画面里应该是什么？我才意识到，好的脚本不是文字的堆砌，而是每一句台词背后都站着一个画面——实验室里的光影、仪器转动的特写、走廊尽头走来的身影。镜头语言讲究"show, not tell"，这句老话在拍摄现场变成了可以执行的动作。

**我的最大收获，是"信息密度"的判断。** 招生宣传片的受众是高考考生和家长，他们会在极短的时间内决定是否继续看下去。所以脚本里每一秒都要回答一个问题：观众为什么留在这一秒？这也让我理解了为什么爆款视频都在前3秒做文章——那不是在讨好算法，而是在尊重观众的时间。

**站在镜头内还给了我一个独特的视角：紧张感。** 你会清楚地知道哪些表达是"挤"出来的，哪些是"长"出来的。自然的东西才有感染力，这也是为什么我在取景阶段会反复跟团队确认：这个画面，人真的会这么看吗？

如果问我这段经历教会了我什么，那就是：好的品牌内容，始于对"人"的理解——他会在哪个瞬间停留，又在哪个瞬间划走。
"""

[[items]]
title = "校园品牌活动的策划复盘：从脑暴到落地"
subtitle = "项目操盘能力 · 初稿"
date = "2025-07"
tags = ["活动策划", "雇主品牌", "项目统筹"]
content = """
一次校园品牌内容，从脑暴到落地，中间隔着的不是灵感，而是一张能把所有环节串起来的执行清单。

**脑暴阶段，最容易犯的错是"什么都想要"。** 参与首届 AZ 大使"成团日"Vlog 拍摄时，我们最初的方案里有打卡、直播、抽奖、路演……讨论到一半我突然意识到，目标用户是学生，他们的耐心和注意力都有限，一个内容只能有一个"记忆点"。最后我们砍掉了大部分玩法，只保留一个核心场景：**拍摄**。让参与者自己成为内容的一部分，这件事本身就自带传播属性。

**落地阶段，最考验的是"拆解"。** 一支 Vlog 看起来是一件事，拆开是脚本、场景、灯光、机位、收音、时间轴、应急预案。我的做法是把每个环节都写成"谁、在什么时候、做什么、交付什么"，然后倒排时间。拍摄环节尤其如此——灯光、机位、收音，任何一环出问题，素材就废了。

**内容产出，是活动价值的放大器。** 拍摄现场只有几小时，但成片的生命周期可以延续几个月。我们边拍边剪，当天出花絮，让参与的学生第一时间在朋友圈看到自己，这种"被看见"的体验反过来又推动了下一场活动的报名。成片最终收获了 5000+ 播放量。

复盘下来，我对"策划"的理解不再是天马行空的创意，而是**在约束条件下做出最好选择的能力**——预算、时间、人力都是约束，创意是在约束里跳舞。
"""
